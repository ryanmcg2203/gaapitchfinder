name: Deploy Site to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate canonical dataset
        run: python3 scripts/validate_dataset.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Run JavaScript tests
        run: node --test tests/*.js

      - name: Generate map data from CSV
        run: python3 scripts/generate_map_data.py

      - name: Generate public dataset downloads
        run: python3 scripts/generate_dataset_downloads.py

      - name: Generate public dataset metadata
        run: python3 scripts/generate_public_metadata.py

      - name: Verify public metadata is committed
        run: git diff --exit-code -- README.md site/dataset.html

      - name: Generate club pages and sitemap
        run: python3 scripts/generate_club_pages.py

      - name: Audit generated site
        run: python3 scripts/audit_site.py

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests
        run: npm run test:browser

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
