name: Deploy Site to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate canonical dataset
        run: python3 scripts/validate_dataset.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Generate map data from CSV
        run: python3 scripts/generate_map_data.py

      - name: Generate club pages and sitemap
        run: python3 scripts/generate_club_pages.py

      - name: Audit generated site
        run: python3 scripts/audit_site.py

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate canonical dataset
        run: python3 scripts/validate_dataset.py

      - name: Generate map data from CSV
        run: python3 scripts/generate_map_data.py

      - name: Generate club pages and sitemap
        run: python3 scripts/generate_club_pages.py

      - name: Audit generated site
        run: python3 scripts/audit_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
