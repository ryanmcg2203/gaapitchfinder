---
layout: default
---
<div class="page-content">
  <div class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <div class="post-date">{{ page.date | date: "%e %B %Y" }} &middot; {{ page.read_time | default: "3 min read" }}</div>
  </div>
  <div class="post-body">
    {{ content }}
  </div>
  <nav class="post-nav">
    <div></div>
    {% if page.previous_title %}
    <div class="post-nav-next">
      <span class="post-nav-label">Older</span>
      <a href="{{ page.previous_url }}">{{ page.previous_title }}</a>
    </div>
    {% endif %}
  </nav>
  <a class="back-link" href="./">&larr; Back to Blog</a>
</div>
