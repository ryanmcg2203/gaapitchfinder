<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch of the Day – GAA Pitch Finder</title>
<link rel="icon" type="image/png" href="img/logo-icon.png">
<meta property="og:title" content="Pitch of the Day – GAA Pitch Finder">
<meta property="og:description" content="Discover a different GAA pitch every day from the GAA Pitch Finder map.">
<meta property="og:image" content="https://gaapitchfinder.com/img/logo-black.png">
<meta property="og:url" content="https://gaapitchfinder.com/pitch-of-the-day.html">
<meta property="og:type" content="website">
<link rel="canonical" href="https://gaapitchfinder.com/pitch-of-the-day.html">
<meta name="description" content="Discover a different GAA pitch every day from the GAA Pitch Finder map.">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"Pitch of the Day – GAA Pitch Finder","description":"Discover a different GAA pitch every day from the GAA Pitch Finder map.","url":"https://gaapitchfinder.com/pitch-of-the-day.html","isPartOf":{"@type":"WebSite","name":"GAA Pitch Finder","url":"https://gaapitchfinder.com/"}}</script>
{{ analytics }}
<link rel="stylesheet" href="css/style.css">
</head>
<body>

{{ navigation }}

<main class="page-content">
  <p class="potd-kicker" id="potd-date">Pitch of the Day</p>
  <h1>Pitch of the Day</h1>
  <p>Every day, this page picks one pitch from the GAA Pitch Finder dataset. No leaderboard, no judgement — just a small daily wander around the GAA map.</p>

  <section class="potd-card" id="potd-card" aria-live="polite">
    <p class="potd-loading">Loading today’s pitch…</p>
  </section>

  <p><a href="/" class="back-link">Back to the map</a></p>
</main>

{{ footer }}

{{ navigation_script }}
<script>
(function() {
  const card = document.getElementById('potd-card');
  const dateLabel = document.getElementById('potd-date');
  const today = new Date();
  const dayKey = today.toISOString().slice(0, 10);
  const displayDate = new Intl.DateTimeFormat(undefined, {
    weekday: 'long',
    year: 'numeric',
    month: 'long',
    day: 'numeric'
  }).format(today);

  function esc(value) {
    return String(value || '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[char]));
  }

  function dayIndex(key, count) {
    let hash = 2166136261;
    for (let index = 0; index < key.length; index += 1) {
      hash ^= key.charCodeAt(index);
      hash = Math.imul(hash, 16777619);
    }
    return (hash >>> 0) % count;
  }

  function pitchKey(pitch) {
    return JSON.stringify([
      pitch.c || '', pitch.p || '', pitch.k || '', pitch.r || '',
      Number(pitch.la), Number(pitch.lo)
    ]);
  }

  function renderPitch(pitch, count) {
    const club = esc(pitch.c);
    const pitchName = esc(pitch.p || 'Pitch location');
    const location = esc([pitch.k, pitch.r].filter(Boolean).join(', '));
    const mapsUrl = `https://maps.google.com/?daddr=${encodeURIComponent(pitch.la)},${encodeURIComponent(pitch.lo)}`;
    const mapEmbed = `https://maps.google.com/maps?q=${encodeURIComponent(`${pitch.la},${pitch.lo}`)}&z=13&output=embed`;
    const clubUrl = pitch.u ? esc(pitch.u) : '';
    const mapParams = new URLSearchParams();
    if (pitch.r) mapParams.set('region', pitch.r);
    if (pitch.k) mapParams.set('county', pitch.k);
    if (pitch.c) mapParams.set('club', pitch.c);
    if (pitch.p) mapParams.set('pitch', pitch.p);
    if (pitch.c) mapParams.set('q', pitch.c);
    mapParams.set('focus', pitchKey(pitch));
    const mapSearchUrl = esc(`/?${mapParams.toString()}`);

    dateLabel.textContent = `Pitch of the Day · ${displayDate}`;
    card.innerHTML = `
      <div class="potd-map">
        <div class="potd-map-placeholder">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7Zm0 9.4A2.4 2.4 0 1 1 12 6.6a2.4 2.4 0 0 1 0 4.8Z"/></svg>
          <p>Interactive map provided by Google</p>
          <button type="button" data-google-map-src="${esc(mapEmbed)}" data-map-title="Map showing ${club}">Load Google map</button>
        </div>
      </div>
      <div class="potd-body">
        <h2>${club}</h2>
        <p class="potd-pitch">${pitchName}</p>
        <p class="potd-meta">
          <span>${location}</span>
          <span>${Number(pitch.la).toFixed(5)}, ${Number(pitch.lo).toFixed(5)}</span>
          <span>Picked from ${count.toLocaleString()} pitches</span>
        </p>
        <div class="potd-actions">
          ${clubUrl ? `<a href="${clubUrl}">Club page</a>` : ''}
          <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer">Google Maps directions</a>
          <a href="${mapSearchUrl}">Find on the map</a>
        </div>
      </div>
    `;
  }

  card.addEventListener('click', event => {
    const button = event.target.closest('[data-google-map-src]');
    if (!button) return;
    const map = button.closest('.potd-map');
    const iframe = document.createElement('iframe');
    iframe.src = button.dataset.googleMapSrc;
    iframe.referrerPolicy = 'no-referrer-when-downgrade';
    iframe.title = button.dataset.mapTitle;
    map.replaceChildren(iframe);
  });

  fetch('data.json')
    .then(response => response.json())
    .then(data => {
      const pitches = data.filter(pitch => Number.isFinite(Number(pitch.la)) && Number.isFinite(Number(pitch.lo)));
      if (!pitches.length) throw new Error('No pitch data available');
      renderPitch(pitches[dayIndex(dayKey, pitches.length)], pitches.length);
    })
    .catch(() => {
      card.innerHTML = '<p class="potd-loading">Could not load today’s pitch. Try refreshing the page.</p>';
    });
})();
</script>
</body>
</html>
